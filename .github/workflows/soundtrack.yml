name: Gerar trilha sonora original (Etapa 25)
on:
  push:
    branches: [main]
    paths:
      - scripts/compose_soundtrack.py
      - .github/workflows/soundtrack.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-mp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthesis dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Install ffmpeg/ffprobe for portable original MP3 encoding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate real original soundtrack files
        run: |
          command -v ffmpeg
          python scripts/compose_soundtrack.py
      - name: Inspect all five audio files with ffprobe
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('public/audio')
          metadata=json.loads((root/'manifest.json').read_text())
          assert len(metadata)==5
          for key,info in metadata.items():
              path=root/info['file']
              assert path.stat().st_size>100000, path
              seconds=float(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries',
                  'format=duration','-of','default=noprint_wrappers=1:nokey=1',
                  str(path)],text=True))
              assert 60<=seconds<=120, (key,seconds)
              print(key,round(seconds,2),'s',path.stat().st_size,'bytes')
          PY
      - name: Commit generated MP3 and manifest to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/*.mp3 public/audio/manifest.json
          if git diff --cached --quiet; then echo 'Audio is already up to date'; exit 0; fi
          git commit -m 'assets(stage25): five original scored MP3 soundtracks [skip ci]'
          git push origin HEAD:main
